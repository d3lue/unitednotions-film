# A second way to publish, started by hand from the Actions tab on GitHub ("Run workflow").
# The workshop on the DreamHost server is the one that counts: the editing page at /edit/ writes there.
# This sends what is in git up to that workshop (without removing anything there) and asks the server to build.
# Use it after changing a text file or the program here on GitHub. The pages written on the editing page live on the
# server: this never sends them up, so it cannot undo one.
#
# It needs one secret in the repository (Settings > Secrets and variables > Actions):
#   DREAMHOST_SSH_KEY   the private half of the deploy key whose public half is in the server's ~/.ssh/authorized_keys

name: Publish the site

on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

env:
  UNF_USER: danfal17
  UNF_HOST: iad1-shared-b7-43.dreamhost.com

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: The key to the server
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DREAMHOST_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$UNF_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Send what is here up to the server's workshop
        run: |
          rsync -rlt --exclude='video-in' --exclude='pages-in' --exclude='picture-in' --exclude='data/research.json' --exclude='data/research-renditions.json' --exclude='data/research-videos.json' --exclude='__pycache__' \
            build/ "$UNF_USER@$UNF_HOST:unf-workshop/build/"
          scp -q check.sh server/server-publish.sh "$UNF_USER@$UNF_HOST:unf-workshop/"

      - name: Build on the server and check the live site
        run: ssh "$UNF_USER@$UNF_HOST" "cd unf-workshop && rm -f publish.log && sh server-publish.sh; cat publish.log; grep -q 'failed: 0' publish.log"
