# Publishes the site whenever something is pushed to the main branch.
# It builds the pages on GitHub's machine and sends them to DreamHost. Three minutes, more or less.
#
# It needs one secret in the repository (Settings > Secrets and variables > Actions):
#   DREAMHOST_SSH_KEY   the private half of the deploy key whose public half is in the server's ~/.ssh/authorized_keys
#
# The videos of the lab notes (1.2 GB) are not in git. They live on the server, and are brought down
# before the build so the pages know they exist. A new video is added from a Mac with   sh publish.sh

name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

env:
  UNF_USER: danfal17
  UNF_HOST: iad1-shared-b7-43.dreamhost.com

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools the build needs
        run: |
          pip install pillow numpy fonttools brotli
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg rsync

      - name: The key to the server
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DREAMHOST_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$UNF_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Bring the videos down from the server
        run: |
          mkdir -p site/assets/video
          rsync -rt "$UNF_USER@$UNF_HOST:unitednotions.film/assets/video/" site/assets/video/

      - name: Pictures and videos that are new
        run: python3 build/make_research_media.py

      - name: Build the pages
        run: python3 build/build.py | tail -5

      - name: Upload
        run: sh upload.sh "$UNF_USER" go | grep -vE '^ +[0-9]' || true

      - name: Check the live site
        run: sh check.sh https://unitednotions.film
